[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcest"
version = "0.1.1"
description = "Methods for estimation of functional connectivity"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Onno P. Kampman", email = "onno.kampman@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "gpflow==2.10.0",
    "ipykernel",
    "matplotlib",
    "numpy",
    "pandas==1.5.3",
    "rpy2==3.4.5",
    "scipy",
    "statsmodels",
    "tensorflow==2.15",
    "tensorflow-probability==0.23.*",
    "tf-keras",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/OnnoKampman/FCEst"
Repository = "https://github.com/OnnoKampman/FCEst"
Issues = "https://github.com/OnnoKampman/FCEst/issues"

[tool.setuptools]
packages = ["fcest"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "notebooks",
    "tests",
]

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize Python syntax)
    "B",      # flake8-bugbear (find bugs)
    "C4",     # flake8-comprehensions (better comprehensions)
    "SIM",    # flake8-simplify (simplify code)
    "ARG",    # flake8-unused-arguments
    "PIE",    # flake8-pie (miscellaneous lints)
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "Q",      # flake8-quotes
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (sometimes needed)
    "C901",   # too complex (we can enable this later if needed)
    "PT011",  # pytest.raises without match (can be too strict)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint.isort]
known-first-party = ["fcest"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true

# Ignore missing imports for libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "gpflow.*",
    "rpy2.*",
    "tensorflow.*",
    "tensorflow_probability.*",
    "tf_keras.*",
]
ignore_missing_imports = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "networkx.*",
]
ignore_missing_imports = true
